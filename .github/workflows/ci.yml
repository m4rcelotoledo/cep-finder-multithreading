name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Instalar dependências
        run: go mod download

      # Can't run linter goanalysis_metalinter: buildir: failed to load package goarch: could not load export data: internal error in importing \"internal/goarch\" (unsupported version: 2);
      # - name: Rodar Lint
      #   uses: golangci/golangci-lint-action@v4
      #   with:
      #     version: v1.55.2

      - name: Rodar Testes e Gerar Coverage
        run: go test -v ./... -coverprofile=coverage.txt

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: m4rcelotoledo/cep-finder-multithreading

      - name: Build
        run: go build -v ./...
